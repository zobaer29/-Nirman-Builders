<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Nirman Builders</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style type="text/tailwindcss">
      @theme {
        --font-poppins: "Poppins", sans-serif;
      }
      body {
        font-family: var(--font-poppins);
      }
    </style>
  </head>
  <body class="bg-gray-50 text-slate-900">
    <header
      class="flex flex-wrap md:flex-nowrap justify-between items-center gap-4 px-4 md:px-10 py-4 bg-gray-100 shadow-sm sticky top-0 z-50"
    >
      <h3 class="text-2xl font-bold">Nirman Builders</h3>
      <div
        class="flex flex-wrap items-center gap-4 md:gap-10 w-full md:w-auto justify-between md:justify-end"
      >
        <ul
          class="flex flex-wrap gap-4 md:gap-10 text-sm md:text-base font-medium"
        >
          <li>
            <a href="index.html" class="hover:text-blue-500 transition-colors"
              >Home</a
            >
          </li>
          <li>
            <a href="project.html" class="hover:text-blue-500 transition-colors"
              >Projects</a
            >
          </li>
          <li>
            <a href="About.html" class="hover:text-blue-500 transition-colors"
              >About</a
            >
          </li>
          <li>
            <a
              href="index.html#contact"
              class="hover:text-blue-500 transition-colors"
              >Contact</a
            >
          </li>
        </ul>
        <a
          href="login.html"
          class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-semibold transition-all active:scale-95"
          >Login</a
        >
      </div>
    </header>

    <main>
      <section
        class="relative py-20 min-h-[78vh] flex justify-center items-center overflow-hidden bg-slate-900"
      >
        <!-- Background Image -->
        <div class="absolute inset-0">
          <img
            src="img/construction-workers-sunset.jpg"
            alt="Construction"
            class="w-full h-full object-cover opacity-30"
          />
          <div
            class="absolute inset-0 bg-gradient-to-b from-slate-900/80 via-transparent to-slate-900/80"
          ></div>
        </div>

        <!-- Glow effect -->
        <div
          class="absolute w-96 h-96 bg-emerald-500/20 rounded-full blur-3xl -top-10 -left-10"
        ></div>

        <!-- Form Card -->
        <div
          class="relative z-10 w-full max-w-md mx-4 p-8 md:p-10 bg-white/5 border-2 border-white/20 backdrop-blur-xl rounded-3xl text-white"
        >
          <h2 class="text-3xl font-bold text-center mb-8">Create Account</h2>

          <form class="space-y-5">
            <input
              type="text"
              placeholder="Full Name"
              class="w-full bg-transparent border-2 border-white/30 rounded-full px-6 py-3 outline-none focus:border-white placeholder:text-white/60"
            />

            <input
              type="email"
              placeholder="Email Address"
              class="w-full bg-transparent border-2 border-white/30 rounded-full px-6 py-3 outline-none focus:border-white placeholder:text-white/60"
            />

            <input
              type="text"
              placeholder="Username"
              class="w-full bg-transparent border-2 border-white/30 rounded-full px-6 py-3 outline-none focus:border-white placeholder:text-white/60"
            />

            <input
              type="password"
              placeholder="Password"
              class="w-full bg-transparent border-2 border-white/30 rounded-full px-6 py-3 outline-none focus:border-white placeholder:text-white/60"
            />

            <input
              type="password"
              placeholder="Confirm Password"
              class="w-full bg-transparent border-2 border-white/30 rounded-full px-6 py-3 outline-none focus:border-white placeholder:text-white/60"
            />

            <label class="flex items-start gap-2 text-sm cursor-pointer">
              <input type="checkbox" class="accent-white w-4 h-4 mt-0.5" />
              <span>I agree to the Terms and Privacy Policy</span>
            </label>

            <button
              class="w-full bg-white text-slate-900 font-bold py-3 rounded-full hover:bg-gray-200 transition active:scale-95"
            >
              Register
            </button>

            <p class="text-center text-sm">
              Already have an account?
              <a href="login.html" class="font-semibold hover:underline"
                >Login</a
              >
            </p>
          </form>
        </div>
      </section>
    </main>

    <footer
      class="bg-slate-900 text-gray-400 py-12 px-6 border-t border-slate-800"
    >
      <div
        class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-8"
      >
        <div class="text-white">
          <span class="text-2xl font-bold">Nirman Builders</span>
          <p class="text-sm mt-2 opacity-60">Building excellence since 2014.</p>
        </div>
        <nav class="flex gap-8 text-sm">
          <a href="#" class="hover:text-white">Privacy</a>
          <a href="#" class="hover:text-white">Terms</a>
          <a href="#" class="hover:text-white">Help</a>
        </nav>
        <p class="text-sm">© 2026 Nirman Builders. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
