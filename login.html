<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Nirman Builders</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style type="text/tailwindcss">
      @theme {
        --font-poppins: "Poppins", sans-serif;
      }
      body {
        font-family: var(--font-poppins);
      }
    </style>
  </head>

  <body class="bg-slate-900 text-white min-h-screen">
    <!-- Navbar -->
    <header
      class="flex justify-between items-center px-6 md:px-10 py-4 bg-gray-100 text-slate-900 shadow-sm sticky top-0 z-50"
    >
      <h3 class="text-2xl font-bold">Nirman Builders</h3>

      <div class="flex items-center gap-6">
        <ul class="flex gap-6 font-medium text-sm md:text-base">
          <li><a href="index.html" class="hover:text-blue-500">Home</a></li>
          <li>
            <a href="project.html" class="hover:text-blue-500">Projects</a>
          </li>
          <li><a href="about.html" class="hover:text-blue-500">About</a></li>
          <li>
            <a href="index.html#contact" class="hover:text-blue-500">Contact</a>
          </li>
        </ul>

        <a
          href="login.html"
          class="bg-blue-600 text-white px-5 py-2 rounded-lg font-semibold hover:bg-blue-700 transition"
        >
          Login
        </a>
      </div>
    </header>

    <!-- Background -->
    <div class="absolute inset-0">
      <img
        src="img/construction-workers-sunset.jpg"
        class="w-full h-full object-cover opacity-30"
      />
      <div
        class="absolute inset-0 bg-gradient-to-b from-slate-900/80 via-transparent to-slate-900/80"
      ></div>
    </div>

    <!-- Login Section -->
    <div
      class="flex items-center justify-center min-h-[calc(100vh-80px)] px-4 relative z-10"
    >
      <!-- Login Card -->
      <div
        class="w-full max-w-md p-8 bg-white/5 backdrop-blur-xl border border-white/20 rounded-3xl shadow-lg"
      >
        <h2 class="text-3xl font-bold text-center mb-8">Login</h2>

        <form action="login.php" method="POST" class="space-y-6">
          <input
            type="text"
            name="username"
            placeholder="Username"
            required
            class="w-full bg-transparent border border-white/30 rounded-full px-6 py-3 outline-none focus:border-white placeholder:text-white/60"
          />

          <input
            type="password"
            name="password"
            placeholder="Password"
            required
            class="w-full bg-transparent border border-white/30 rounded-full px-6 py-3 outline-none focus:border-white placeholder:text-white/60"
          />

          <div class="flex justify-between text-sm">
            <label class="flex items-center gap-2">
              <input type="checkbox" class="accent-white" />
              Remember me
            </label>
            <a href="#" class="hover:underline">Forgot?</a>
          </div>

          <button
            type="submit"
            class="w-full bg-emerald-500 hover:bg-emerald-600 py-3 rounded-full font-bold transition active:scale-95"
          >
            Login
          </button>

          <p class="text-center text-sm">
            Don't have an account?
            <a href="register.html" class="font-semibold hover:underline"
              >Register</a
            >
          </p>
        </form>
      </div>
    </div>
  </body>
</html>
